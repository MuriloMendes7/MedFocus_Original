<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/medfocus-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedFocus — Flashcards e Simulados para Medicina</title>
    <meta
      name="description"
      content="Aprenda com flashcards inteligentes de repetição espaçada (SM-2), simulados cronometrados e estatísticas detalhadas."
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved === 'dark' || saved === 'light' ? saved : prefersDark ? 'dark' : 'light';
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(theme);
          root.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
